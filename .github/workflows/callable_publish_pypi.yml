name: callable_publish_pypi

on:
  workflow_call:
    inputs:
      publish_to_testpypi:
        description: Publish to TestPyPI instead of PyPI
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build package distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Check release tag matches package version
        shell: bash
        run: |
          package_version="$(uv version --short)"
          if [[ "${package_version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match package version '${package_version}'." >&2
            exit 1
          fi
      - name: Build distributions
        run: uv build --out-dir dist
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.publish_to_testpypi && 'testpypi' || 'pypi' }}
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.publish_to_testpypi && 'https://test.pypi.org/legacy/' || 'https://upload.pypi.org/legacy/' }}
