name: callable_pytests

on:
  workflow_call:

jobs:
  callable_pytests:
    name: Run Pytests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Run Pytests
        uses: EED-Solutions/eed_gha_workflows/.github/actions/pytests@v1.0.0
        with:
          python_version: ${{ matrix.python-version }}
          version-file: ''
