name: callable_pytests_cov

on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string

jobs:
  callable_pytests_cov:
    name: Run Pytests with Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Run Pytests with Coverage
        uses: EED-Solutions/eed_gha_workflows/.github/actions/pytests_cov@v1.0.0
        with:
          package_name: ${{ inputs.package_name }}
          python_version: "3.13"
